<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jeopardy Buzzer - Player</title>
    <style>
        /* Theme System - CSS Custom Properties */
        
        /* Default Theme (Blue) */
        :root,
        .theme-blue {
            /* Background Colors */
            --bg-primary: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --bg-secondary: rgba(0, 31, 77, 0.9);
            --bg-tertiary: rgba(255, 255, 255, 0.1);
            --bg-tertiary-hover: rgba(255, 255, 255, 0.2);
            
            /* Text Colors */
            --text-primary: white;
            --text-secondary: #ffd700;
            --text-muted: rgba(255, 255, 255, 0.8);
            
            /* Status Colors */
            --status-waiting-bg: rgba(255, 165, 0, 0.3);
            --status-waiting-text: #ffa500;
            --status-enabled-bg: rgba(0, 255, 0, 0.3);
            --status-enabled-text: #00ff00;
            --status-locked-bg: rgba(255, 0, 0, 0.3);
            --status-locked-text: #ff6666;
            --status-answered-bg: rgba(128, 0, 128, 0.3);
            --status-answered-text: #b19cd9;
            
            /* Button Colors */
            --btn-ready-bg: linear-gradient(45deg, #00ff00, #32cd32);
            --btn-ready-text: #004d00;
            --btn-early-bg: #4a7c59;
            --btn-early-text: #ffffff;
            --btn-disabled-bg: #666;
            --btn-disabled-text: #999;
            --btn-cooldown-bg: linear-gradient(45deg, #ff4444, #cc0000);
            --btn-cooldown-text: white;
            --btn-buzzed-bg: linear-gradient(45deg, #ffd700, #ffed4a);
            --btn-buzzed-text: #b8860b;
            
            /* Accent Colors */
            --accent-gold: #ffd700;
            --accent-green: #00ff00;
            --accent-border: #ffd700;
            --winner-bg: rgba(255, 215, 0, 0.3);
            --winner-border: #ffd700;
            --first-bg: rgba(0, 255, 0, 0.2);
            --first-border: #00ff00;
            
            /* Shadow */
            --shadow-primary: 0 5px 15px rgba(0, 0, 0, 0.3);
            --shadow-button: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        /* Dark Theme */
        .theme-dark {
            /* Background Colors */
            --bg-primary: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            --bg-secondary: rgba(20, 20, 20, 0.95);
            --bg-tertiary: rgba(255, 255, 255, 0.05);
            --bg-tertiary-hover: rgba(255, 255, 255, 0.1);
            
            /* Text Colors */
            --text-primary: #e0e0e0;
            --text-secondary: #bb86fc;
            --text-muted: rgba(224, 224, 224, 0.7);
            
            /* Status Colors */
            --status-waiting-bg: rgba(255, 193, 7, 0.2);
            --status-waiting-text: #ffc107;
            --status-enabled-bg: rgba(76, 175, 80, 0.2);
            --status-enabled-text: #4caf50;
            --status-locked-bg: rgba(244, 67, 54, 0.2);
            --status-locked-text: #f44336;
            --status-answered-bg: rgba(156, 39, 176, 0.2);
            --status-answered-text: #9c27b0;
            
            /* Button Colors */
            --btn-ready-bg: linear-gradient(45deg, #4caf50, #66bb6a);
            --btn-ready-text: #1b5e20;
            --btn-early-bg: #424242;
            --btn-early-text: #e0e0e0;
            --btn-disabled-bg: #2c2c2c;
            --btn-disabled-text: #757575;
            --btn-cooldown-bg: linear-gradient(45deg, #f44336, #d32f2f);
            --btn-cooldown-text: white;
            --btn-buzzed-bg: linear-gradient(45deg, #ff9800, #ffa726);
            --btn-buzzed-text: #e65100;
            
            /* Accent Colors */
            --accent-gold: #bb86fc;
            --accent-green: #4caf50;
            --accent-border: #bb86fc;
            --winner-bg: rgba(187, 134, 252, 0.2);
            --winner-border: #bb86fc;
            --first-bg: rgba(76, 175, 80, 0.2);
            --first-border: #4caf50;
            
            /* Shadow */
            --shadow-primary: 0 5px 15px rgba(0, 0, 0, 0.5);
            --shadow-button: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        /* Green Theme */
        .theme-green {
            /* Background Colors */
            --bg-primary: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
            --bg-secondary: rgba(27, 94, 32, 0.9);
            --bg-tertiary: rgba(255, 255, 255, 0.1);
            --bg-tertiary-hover: rgba(255, 255, 255, 0.2);
            
            /* Text Colors */
            --text-primary: white;
            --text-secondary: #81c784;
            --text-muted: rgba(255, 255, 255, 0.8);
            
            /* Status Colors */
            --status-waiting-bg: rgba(255, 152, 0, 0.3);
            --status-waiting-text: #ff9800;
            --status-enabled-bg: rgba(139, 195, 74, 0.3);
            --status-enabled-text: #8bc34a;
            --status-locked-bg: rgba(244, 67, 54, 0.3);
            --status-locked-text: #f44336;
            --status-answered-bg: rgba(156, 39, 176, 0.3);
            --status-answered-text: #9c27b0;
            
            /* Button Colors */
            --btn-ready-bg: linear-gradient(45deg, #8bc34a, #aed581);
            --btn-ready-text: #33691e;
            --btn-early-bg: #558b2f;
            --btn-early-text: #ffffff;
            --btn-disabled-bg: #424242;
            --btn-disabled-text: #9e9e9e;
            --btn-cooldown-bg: linear-gradient(45deg, #f44336, #e57373);
            --btn-cooldown-text: white;
            --btn-buzzed-bg: linear-gradient(45deg, #ffeb3b, #fff176);
            --btn-buzzed-text: #f57f17;
            
            /* Accent Colors */
            --accent-gold: #81c784;
            --accent-green: #8bc34a;
            --accent-border: #81c784;
            --winner-bg: rgba(129, 199, 132, 0.3);
            --winner-border: #81c784;
            --first-bg: rgba(139, 195, 74, 0.2);
            --first-border: #8bc34a;
            
            /* Shadow */
            --shadow-primary: 0 5px 15px rgba(0, 0, 0, 0.3);
            --shadow-button: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        /* Catppuccin Mocha Theme for Dan/Daniel */
        .theme-purple {
            /* Background Colors - Using Catppuccin Mocha Base/Mantle/Surface */
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #313244 100%);
            --bg-secondary: rgba(30, 30, 46, 0.95);
            --bg-tertiary: rgba(69, 71, 90, 0.8);
            --bg-tertiary-hover: rgba(88, 91, 112, 0.9);
            
            /* Text Colors - Using Catppuccin Text/Subtext */
            --text-primary: #cdd6f4;
            --text-secondary: #f5c2e7;
            --text-muted: #bac2de;
            
            /* Status Colors - Using Catppuccin accent colors */
            --status-waiting-bg: rgba(249, 226, 175, 0.2);
            --status-waiting-text: #f9e2af;
            --status-enabled-bg: rgba(166, 227, 161, 0.2);
            --status-enabled-text: #a6e3a1;
            --status-locked-bg: rgba(243, 139, 168, 0.2);
            --status-locked-text: #f38ba8;
            --status-answered-bg: rgba(203, 166, 247, 0.2);
            --status-answered-text: #cba6f7;
            
            /* Button Colors - Using Catppuccin Green/Red/Yellow */
            --btn-ready-bg: linear-gradient(45deg, #a6e3a1, #94e2d5);
            --btn-ready-text: #1e1e2e;
            --btn-early-bg: #585b70;
            --btn-early-text: #cdd6f4;
            --btn-disabled-bg: #45475a;
            --btn-disabled-text: #6c7086;
            --btn-cooldown-bg: linear-gradient(45deg, #f38ba8, #eba0ac);
            --btn-cooldown-text: #1e1e2e;
            --btn-buzzed-bg: linear-gradient(45deg, #f9e2af, #fab387);
            --btn-buzzed-text: #1e1e2e;
            
            /* Accent Colors - Using Catppuccin Pink/Green/Blue */
            --accent-gold: #f5c2e7;
            --accent-green: #a6e3a1;
            --accent-border: #f5c2e7;
            --winner-bg: rgba(245, 194, 231, 0.2);
            --winner-border: #f5c2e7;
            --first-bg: rgba(166, 227, 161, 0.2);
            --first-border: #a6e3a1;
            
            /* Shadow - Darker for Catppuccin aesthetic */
            --shadow-primary: 0 5px 15px rgba(17, 17, 27, 0.4);
            --shadow-button: 0 10px 30px rgba(17, 17, 27, 0.5);
        }

        .theme-custom {
            --bg-primary: your-gradient;
            --text-primary: your-color;
            /* ... define all variables */
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Matches body's background so iOS Safari's safe areas (notch/dynamic island,
           home indicator) show the theme color instead of white — requires
           viewport-fit=cover on the meta viewport tag to take effect. The theme class
           is applied to <html> as well as <body> (see applyThemeForPlayer) so this
           tracks whichever theme is active, not just the default. */
        html {
            background: var(--bg-primary);
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-x: hidden;
        }

        .header {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: var(--shadow-primary);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .player-name {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .team-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .status {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9em;
            text-align: center;
        }

        .status.waiting {
            background: var(--status-waiting-bg);
            color: var(--status-waiting-text);
        }

        .status.enabled {
            background: var(--status-enabled-bg);
            color: var(--status-enabled-text);
            animation: pulse 2s infinite;
        }

        .status.locked {
            background: var(--status-locked-bg);
            color: var(--status-locked-text);
        }

        .status.answered {
            background: var(--status-answered-bg);
            color: var(--status-answered-text);
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .buzz-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .buzz-button {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: none;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 20px;
            box-shadow: var(--shadow-button);
        }

        .buzz-button.ready {
            background: var(--btn-ready-bg);
            color: var(--btn-ready-text);
            animation: buzzReady 2s infinite;
        }

        .buzz-button.early-warning {
            background: var(--btn-early-bg);
            color: var(--btn-early-text);
        }

        .buzz-button.disabled {
            background: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            cursor: not-allowed;
        }

        .buzz-button.cooldown {
            background: var(--btn-cooldown-bg);
            color: var(--btn-cooldown-text);
            cursor: not-allowed;
        }

        .buzz-button.buzzed {
            background: var(--btn-buzzed-bg);
            color: var(--btn-buzzed-text);
            animation: buzzed 1s infinite;
        }

        @keyframes buzzReady {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes buzzed {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-gold); }
            50% { transform: scale(1.1); box-shadow: 0 0 40px var(--accent-gold); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--accent-gold); }
        }

        .buzz-text {
            font-size: 0.8em;
            margin-top: 10px;
            text-align: center;
            opacity: 0.8;
        }

        .team-list {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-primary);
        }

        .team-list h3 {
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1em;
        }

        .teammates {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .teammate {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9em;
            border: 2px solid transparent;
        }

        .teammate.self {
            border-color: var(--accent-border);
            background: var(--winner-bg);
        }

        .teammate.online {
            position: relative;
        }

        .teammate.online::after {
            content: '●';
            color: var(--accent-green);
            position: absolute;
            top: -2px;
            right: -5px;
            font-size: 12px;
        }

        .buzz-history {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-primary);
        }

        .buzz-history h3 {
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.1em;
        }

        .buzz-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            font-size: 0.9em;
        }

        .buzz-item.winner {
            background: var(--winner-bg);
            border: 2px solid var(--winner-border);
        }

        .buzz-item.first {
            background: var(--first-bg);
            border: 2px solid var(--first-border);
        }

        .buzz-rank {
            font-weight: bold;
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .action-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--bg-tertiary-hover);
            transform: translateY(-2px);
        }

        .fj-section {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-primary);
            text-align: center;
        }

        .fj-section h2 {
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .fj-current {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .fj-current-label {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .fj-current-value {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent-gold);
            word-break: break-word;
        }

        .fj-current-value.pending {
            color: var(--text-muted);
            font-style: italic;
            font-weight: normal;
        }

        .fj-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--accent-border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 10px;
        }

        .fj-error {
            color: var(--status-locked-text);
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .fj-cap {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .fj-submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--btn-ready-bg);
            color: var(--btn-ready-text);
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
        }

        .fj-submit-btn:disabled {
            background: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            cursor: not-allowed;
        }

        .fj-waiting {
            color: var(--text-muted);
            font-style: italic;
        }

        .cooldown-timer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            color: var(--text-primary);
        }

        /* Theme Selector (for demo purposes) */
        .theme-selector {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.blue { background: linear-gradient(45deg, #1e3c72, #2a5298); }
        .theme-btn.dark { background: linear-gradient(45deg, #0f0f0f, #1a1a1a); }
        .theme-btn.green { background: linear-gradient(45deg, #1b5e20, #2e7d32); }
        .theme-btn.purple { background: linear-gradient(45deg, #1e1e2e, #313244); }

        @media (max-width: 480px) {
            .buzz-button {
                width: 200px;
                height: 200px;
                font-size: 2em;
            }
            
            .player-info {
                flex-direction: column;
                text-align: center;
            }
            
            .actions {
                flex-direction: column;
            }

            .theme-selector {
                position: relative;
                top: auto;
                right: auto;
                justify-content: center;
                margin-bottom: 10px;
            }
        }

        @media (max-height: 600px) {
            .buzz-button {
                width: 150px;
                height: 150px;
                font-size: 1.5em;
            }
            
            .team-list, .buzz-history {
                margin-bottom: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="player-info">
            <div class="player-name" id="playerName">Loading...</div>
            <div class="team-badge" id="teamBadge">Team ?</div>
        </div>
        <div class="status" id="gameStatus">Waiting for host...</div>
    </div>

    <div class="fj-section" id="finalJeopardySection" style="display: none;">
        <h2>🏆 Final Jeopardy</h2>
        <div id="finalJeopardyBody"></div>
    </div>

    <div class="team-list" id="teamListSection">
        <h3>Your Team</h3>
        <div class="teammates" id="teammates">
            <div>Loading teammates...</div>
        </div>
    </div>

    <div class="buzz-section" id="buzzSection">
        <button class="buzz-button disabled" id="buzzButton">
            🚨
            <div class="cooldown-timer" id="cooldownTimer" style="display: none;"></div>
        </button>
        <div class="buzz-text" id="buzzText">Wait for host to enable buzzing</div>
    </div>

    <div class="buzz-history" id="buzzHistorySection">
        <h3>Current Question Buzzes</h3>
        <div id="buzzList">
            <div style="text-align: center; opacity: 0.5;">No buzzes yet</div>
        </div>
    </div>

    <div class="actions">
        <a href="index.html" class="action-btn">🚪 Leave Game</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="shared.js"></script>
    <script>
        let currentPlayer = null;
        let buzzCooldown = null;

        // Initialize player
        function initializePlayer() {
            const playerData = sessionStorage.getItem('currentPlayer');
            if (!playerData) {
                alert('No player data found. Redirecting to join page.');
                window.location.href = 'index.html';
                return;
            }

            currentPlayer = JSON.parse(playerData);

            // Apply theme based on player name
            applyThemeForPlayer(currentPlayer.name);

            // Update UI with player info
            document.getElementById('playerName').textContent = currentPlayer.name;
            document.getElementById('teamBadge').textContent = getTeamName(currentPlayer.team);
            document.getElementById('teamBadge').style.backgroundColor = getTeamColor(currentPlayer.team);

            // Identifies this socket as a player client so the server routes the
            // correctly-shaped (and, for Final Jeopardy, redacted) broadcast to it.
            // Previously this only ever happened inside registerPlayer() on first
            // join — a page reload gets a brand-new, unidentified socket that never
            // re-registers, so it needs identifying here too, and again on every
            // future reconnect via the socketConnected listener below.
            if (isConnected()) {
                identifyClient('player');
            }

            // Update UI immediately
            updateGameState();

            // Keep player presence updated
            setInterval(() => {
                updatePlayerPresence(currentPlayer.id);
            }, 5000);
        }

        window.addEventListener('socketConnected', () => {
            if (currentPlayer) {
                identifyClient('player');
            }
            if (window.socket && !finalJeopardyListenersRegistered) {
                finalJeopardyListenersRegistered = true;
                window.socket.on('finalJeopardySubmitError', (message) => {
                    showFinalJeopardyError(message);
                });
            }
        });

        // Apply theme based on player name
        function applyThemeForPlayer(playerName) {
            // Applied to <html> as well as <body> so the safe-area background (see the
            // `html` rule above) tracks whichever theme is active, not just the default.
            document.documentElement.classList.remove('theme-blue', 'theme-dark', 'theme-green', 'theme-purple');
            document.body.classList.remove('theme-blue', 'theme-dark', 'theme-green', 'theme-purple');

            // Check if player name contains "dan" anywhere (case insensitive)
            const name = playerName.toLowerCase().trim();
            const theme = name.includes('dan') ? 'theme-purple' : 'theme-blue';
            document.documentElement.classList.add(theme);
            document.body.classList.add(theme);
        }

        // Update game state and UI
        function updateGameState() {
            const gameState = getGameState();
            const fj = gameState && gameState.finalJeopardy;
            if (fj && fj.phase !== 'inactive') {
                renderFinalJeopardyView(gameState);
                return;
            }
            hideFinalJeopardyView();
            updateStatus(gameState);
            updateTeammates(gameState);
            updateBuzzButton(gameState);
            updateBuzzHistory(gameState);
        }

        // Final Jeopardy doesn't fit the buzzer model — all teams wager and answer in
        // parallel rather than racing a single buzzer — so it takes over the whole
        // screen instead of layering onto the buzz UI. lastRenderedFjPhase gates full
        // rebuilds of the sub-view (which recreates the <input>) to phase changes only;
        // every other gameStateUpdate just patches the live value spans in place, so an
        // in-progress teammate's wager/answer update never steals focus or clobbers
        // what this player is mid-typing.
        let lastRenderedFjPhase = null;
        let finalJeopardyListenersRegistered = false;

        function hideFinalJeopardyView() {
            document.getElementById('finalJeopardySection').style.display = 'none';
            document.getElementById('teamListSection').style.display = '';
            document.getElementById('buzzSection').style.display = '';
            document.getElementById('buzzHistorySection').style.display = '';
            lastRenderedFjPhase = null;
        }

        function renderFinalJeopardyView(gameState) {
            document.getElementById('finalJeopardySection').style.display = 'block';
            document.getElementById('teamListSection').style.display = 'none';
            document.getElementById('buzzSection').style.display = 'none';
            document.getElementById('buzzHistorySection').style.display = 'none';

            const fj = gameState.finalJeopardy;
            const statusEl = document.getElementById('gameStatus');
            const bodyEl = document.getElementById('finalJeopardyBody');
            const team = currentPlayer.team;

            if (fj.phase !== lastRenderedFjPhase) {
                lastRenderedFjPhase = fj.phase;
                if (fj.phase === 'wagering') {
                    const maxWager = Math.max(0, (gameState.teamScores && gameState.teamScores[team]) || 0);
                    bodyEl.innerHTML = `
                        <div class="fj-current">
                            <div class="fj-current-label">Current Wager</div>
                            <div class="fj-current-value" id="fjCurrentWager"></div>
                        </div>
                        <div class="fj-cap" id="fjWagerCap"></div>
                        <input type="number" class="fj-input" id="fjWagerInput" placeholder="Enter wager" min="0" max="${maxWager}">
                        <div class="fj-error" id="fjWagerError" style="display: none;"></div>
                        <button class="fj-submit-btn" onclick="submitFinalWager()">Submit Wager</button>
                    `;
                } else if (fj.phase === 'answering') {
                    bodyEl.innerHTML = `
                        <div class="fj-current">
                            <div class="fj-current-label">Your Wager</div>
                            <div class="fj-current-value" id="fjLockedWager"></div>
                        </div>
                        <div class="fj-current">
                            <div class="fj-current-label">Current Answer</div>
                            <div class="fj-current-value" id="fjCurrentAnswer"></div>
                        </div>
                        <input type="text" class="fj-input" id="fjAnswerInput" placeholder="Type your answer" maxlength="200">
                        <div class="fj-error" id="fjAnswerError" style="display: none;"></div>
                        <button class="fj-submit-btn" onclick="submitFinalAnswer()">Submit Answer</button>
                    `;
                } else {
                    // 'resolving' or 'complete'
                    bodyEl.innerHTML = `
                        <div class="fj-current">
                            <div class="fj-current-label">Your Wager</div>
                            <div class="fj-current-value" id="fjFinalWager"></div>
                        </div>
                        <div class="fj-current">
                            <div class="fj-current-label">Your Answer</div>
                            <div class="fj-current-value" id="fjFinalAnswer"></div>
                        </div>
                        <div class="fj-waiting" id="fjResultText"></div>
                    `;
                }
            }

            if (fj.phase === 'wagering') {
                statusEl.textContent = 'Final Jeopardy: submit your wager!';
                statusEl.className = 'status enabled';

                const wager = fj.wagers[team];
                const wagerEl = document.getElementById('fjCurrentWager');
                if (wager === null || wager === undefined) {
                    wagerEl.textContent = 'No wager submitted yet';
                    wagerEl.classList.add('pending');
                } else {
                    wagerEl.textContent = `$${wager.toLocaleString()}`;
                    wagerEl.classList.remove('pending');
                }
                const maxWager = Math.max(0, (gameState.teamScores && gameState.teamScores[team]) || 0);
                const input = document.getElementById('fjWagerInput');
                if (input) input.max = maxWager;
                const capEl = document.getElementById('fjWagerCap');
                if (capEl) capEl.textContent = `You can wager up to $${maxWager.toLocaleString()}`;
            } else if (fj.phase === 'answering') {
                statusEl.textContent = 'Final Jeopardy: submit your answer!';
                statusEl.className = 'status enabled';

                document.getElementById('fjLockedWager').textContent = `$${(fj.wagers[team] || 0).toLocaleString()}`;
                const answer = fj.answers[team];
                const ansEl = document.getElementById('fjCurrentAnswer');
                if (answer) {
                    ansEl.textContent = answer;
                    ansEl.classList.remove('pending');
                } else {
                    ansEl.textContent = 'No answer submitted yet';
                    ansEl.classList.add('pending');
                }
            } else {
                statusEl.textContent = 'Final Jeopardy: waiting for host...';
                statusEl.className = 'status waiting';

                document.getElementById('fjFinalWager').textContent = `$${(fj.wagers[team] || 0).toLocaleString()}`;
                document.getElementById('fjFinalAnswer').textContent = fj.answers[team] || 'No answer submitted';
                const resultEl = document.getElementById('fjResultText');
                if (fj.resolved[team]) {
                    const score = (gameState.teamScores && gameState.teamScores[team]) || 0;
                    resultEl.textContent = `✅ Scored! Your team's score: $${score.toLocaleString()}`;
                } else {
                    resultEl.textContent = 'Waiting for host to score your answer...';
                }
            }
        }

        function showFinalJeopardyError(message) {
            const errorEl = document.getElementById('fjWagerError') || document.getElementById('fjAnswerError');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }
        }

        function submitFinalWager() {
            const input = document.getElementById('fjWagerInput');
            const errorEl = document.getElementById('fjWagerError');
            const amount = parseInt(input.value, 10);
            errorEl.style.display = 'none';

            if (!Number.isInteger(amount) || amount < 0) {
                errorEl.textContent = 'Enter a whole number of $0 or more.';
                errorEl.style.display = 'block';
                return;
            }
            if (!window.socket || !window.socket.connected) {
                errorEl.textContent = 'Not connected to server.';
                errorEl.style.display = 'block';
                return;
            }
            window.socket.emit('submitFinalJeopardyWager', { team: currentPlayer.team, amount });
        }

        function submitFinalAnswer() {
            const input = document.getElementById('fjAnswerInput');
            const errorEl = document.getElementById('fjAnswerError');
            const answer = input.value.trim();
            errorEl.style.display = 'none';

            if (!answer) {
                errorEl.textContent = 'Please enter an answer.';
                errorEl.style.display = 'block';
                return;
            }
            if (!window.socket || !window.socket.connected) {
                errorEl.textContent = 'Not connected to server.';
                errorEl.style.display = 'block';
                return;
            }
            window.socket.emit('submitFinalJeopardyAnswer', { team: currentPlayer.team, answer });
        }

        // Update game status
        function updateStatus(gameState) {
            const statusEl = document.getElementById('gameStatus');
            
            // Check if player is in cooldown (only for early buzzes)
            const playerBuzz = gameState.buzzes.find(b => b.playerId === currentPlayer.id);
            if (playerBuzz && playerBuzz.isEarlyBuzz) {
                const timeSince = Date.now() - playerBuzz.timestamp;
                if (timeSince < gameState.hostControls.buzzCooldown) {
                    statusEl.textContent = 'Early buzz cooldown active';
                    statusEl.className = 'status locked';
                    return;
                }
            }
            
            // Check if someone else has already buzzed
            const someoneElseBuzzed = gameState.buzzes.find(b => 
                b.questionId === gameState.currentQuestion && 
                b.playerId !== currentPlayer.id && 
                !b.isWinner
            );
            if (someoneElseBuzzed) {
                statusEl.textContent = `${someoneElseBuzzed.playerName} buzzed in first`;
                statusEl.className = 'status answered';
                return;
            }
            
            // Check if question already answered
            const winner = gameState.buzzes.find(b => 
                b.questionId === gameState.currentQuestion && b.isWinner
            );
            if (winner) {
                statusEl.textContent = `Question answered by ${winner.playerName}`;
                statusEl.className = 'status answered';
                return;
            }
            
            // Check if this player has buzzed
            if (playerBuzz && !playerBuzz.isWinner) {
                const buzzType = playerBuzz.isEarlyBuzz ? '(early) ' : '';
                statusEl.textContent = `You ${buzzType}buzzed in!`;
                statusEl.className = 'status enabled';
                return;
            }
            
            if (!gameState.hostControls.buzzEnabled) {
                statusEl.textContent = 'Wait for host to enable buzzing...';
                statusEl.className = 'status waiting';
            } else {
                statusEl.textContent = 'Buzzing enabled! Press the button!';
                statusEl.className = 'status enabled';
            }
        }

        // Update teammates list
        function updateTeammates(gameState) {
            const teammatesEl = document.getElementById('teammates');
            const teammates = getTeamMembers(currentPlayer.team);
            
            if (teammates.length === 0) {
                teammatesEl.innerHTML = '<div>No teammates yet</div>';
                return;
            }

            teammatesEl.innerHTML = teammates.map(teammate => {
                const isOnline = teammate.lastSeen && (Date.now() - teammate.lastSeen) < 30000;
                const isSelf = teammate.id === currentPlayer.id;
                return `
                    <div class="teammate ${isSelf ? 'self' : ''} ${isOnline ? 'online' : ''}">
                        ${teammate.name}${isSelf ? ' (You)' : ''}
                    </div>
                `;
            }).join('');
        }

        // Update buzz button
        function updateBuzzButton(gameState) {
            const buttonEl = document.getElementById('buzzButton');
            const textEl = document.getElementById('buzzText');
            const timerEl = document.getElementById('cooldownTimer');
            
            // Clear any existing timer
            if (buzzCooldown) {
                clearInterval(buzzCooldown);
                buzzCooldown = null;
                timerEl.style.display = 'none';
            }

            // Check if player is in early buzz cooldown
            const playerBuzz = gameState.buzzes.find(b => 
                b.playerId === currentPlayer.id && 
                b.questionId === gameState.currentQuestion
            );

            if (playerBuzz && playerBuzz.isEarlyBuzz) {
                const timeSince = Date.now() - playerBuzz.timestamp;
                if (timeSince < gameState.hostControls.buzzCooldown) {
                    // In early buzz cooldown
                    buttonEl.className = 'buzz-button cooldown';
                    buttonEl.disabled = true;
                    textEl.textContent = 'Early buzz penalty';
                    
                    // Show countdown timer
                    timerEl.style.display = 'block';
                    startCooldownTimer(gameState.hostControls.buzzCooldown - timeSince);
                    return;
                }
            }

            // Check if this player already buzzed (and it's not an early buzz that's finished cooling down)
            if (playerBuzz && !playerBuzz.isEarlyBuzz) {
                buttonEl.className = 'buzz-button buzzed';
                buttonEl.disabled = true;
                textEl.textContent = 'You buzzed in!';
                return;
            }

            // Check if someone else has already buzzed
            const someoneElseBuzzed = gameState.buzzes.find(b => 
                b.questionId === gameState.currentQuestion && 
                b.playerId !== currentPlayer.id && 
                !b.isWinner
            );
            if (someoneElseBuzzed) {
                buttonEl.className = 'buzz-button disabled';
                buttonEl.disabled = true;
                textEl.textContent = `${someoneElseBuzzed.playerName} buzzed first`;
                return;
            }

            // Check if question already answered
            const winner = gameState.buzzes.find(b => 
                b.questionId === gameState.currentQuestion && b.isWinner
            );
            if (winner) {
                buttonEl.className = 'buzz-button disabled';
                buttonEl.disabled = true;
                textEl.textContent = 'Question already answered';
                return;
            }

            // Ready to buzz (always available now)
            buttonEl.disabled = false;
            
            if (!gameState.hostControls.buzzEnabled) {
                buttonEl.className = 'buzz-button early-warning';
                textEl.textContent = '2 second penalty if you buzz early';
            } else {
                buttonEl.className = 'buzz-button ready';
                textEl.textContent = 'TAP TO BUZZ IN!';
            }
        }

        // Start cooldown timer
        function startCooldownTimer(remainingTime) {
            const timerEl = document.getElementById('cooldownTimer');
            let remaining = Math.ceil(remainingTime / 1000);
            
            timerEl.textContent = remaining;
            
            buzzCooldown = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(buzzCooldown);
                    buzzCooldown = null;
                    timerEl.style.display = 'none';
                    updateGameState(); // Refresh to enable button
                } else {
                    timerEl.textContent = remaining;
                }
            }, 1000);
        }

        // Update buzz history
        function updateBuzzHistory(gameState) {
            const listEl = document.getElementById('buzzList');
            const buzzes = getCurrentQuestionBuzzes();
            
            if (buzzes.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; opacity: 0.5;">No buzzes yet</div>';
                return;
            }

            listEl.innerHTML = buzzes.map((buzz, index) => {
                const isWinner = buzz.isWinner;
                const isFirst = index === 0;
                const teamColor = getTeamColor(buzz.team);
                
                return `
                    <div class="buzz-item ${isWinner ? 'winner' : ''} ${isFirst && !isWinner ? 'first' : ''}">
                        <div>
                            <span class="buzz-rank">#${index + 1}</span>
                            <span style="color: ${teamColor};">${buzz.playerName}</span>
                            <span>(${getTeamName(buzz.team)})</span>
                            ${isWinner ? ' 🏆' : ''}
                        </div>
                        <div>${formatTime(buzz.timestamp)}</div>
                    </div>
                `;
            }).join('');
        }

        // Handle buzz button click
        document.getElementById('buzzButton').addEventListener('click', async () => {
            if (!isConnected()) {
                showBuzzError('Not connected to server');
                return;
            }

            try {
                const result = await addBuzz(currentPlayer.id, currentPlayer.name, currentPlayer.team);
                
                // Success - provide haptic feedback based on buzz type
                if (navigator.vibrate) {
                    if (result.isEarlyBuzz) {
                        // Early buzz: Error-like pattern (shorter than full error)
                        navigator.vibrate([80, 40, 80, 40, 80]);
                    } else {
                        // Successful buzz: Single strong vibration
                        navigator.vibrate(300);
                    }
                }
            } catch (error) {
                // Error buzzing: Triple short vibrations (error pattern)
                if (navigator.vibrate) {
                    navigator.vibrate([50, 50, 50, 50, 50]);
                }
                
                // Handle errors
                let message = error.message || 'Could not buzz in';
                if (error.reason) {
                    switch (error.reason) {
                        case 'cooldown':
                            message = `Please wait ${Math.ceil(error.remainingTime / 1000)} seconds`;
                            break;
                        case 'already_answered':
                            message = 'Question already answered';
                            break;
                        case 'someone_already_buzzed':
                            message = error.message;
                            break;
                        case 'no_connection':
                            message = 'Not connected to server';
                            break;
                    }
                }
                
                showBuzzError(message);
            }
        });

        function showBuzzError(message) {
            const textEl = document.getElementById('buzzText');
            const originalText = textEl.textContent;
            textEl.textContent = message;
            textEl.style.color = '#ff6666';
            
            setTimeout(() => {
                textEl.style.color = '';
                updateGameState(); // Refresh text
            }, 2000);
        }

        // Listen for game state changes
        window.addEventListener('gameStateChanged', () => {
            updateGameState();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (buzzCooldown) {
                clearInterval(buzzCooldown);
            }
        });

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializePlayer);
    </script>
</body>
