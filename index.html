<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Buzzer - Join Game</title>
    <style>
        /* Theme System - CSS Custom Properties */
        
        /* Default Theme (Blue) */
        :root,
        .theme-blue {
            /* Background Colors */
            --bg-primary: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --bg-secondary: rgba(0, 31, 77, 0.9);
            --bg-tertiary: rgba(255, 255, 255, 0.1);
            --bg-tertiary-hover: rgba(255, 255, 255, 0.2);
            
            /* Text Colors */
            --text-primary: white;
            --text-secondary: #ffd700;
            --text-muted: #b8d4ff;
            
            /* Input Colors */
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-text: #333;
            --input-focus-shadow: rgba(255, 215, 0, 0.5);
            
            /* Button Colors */
            --btn-primary-bg: linear-gradient(45deg, #ffd700, #ffed4a);
            --btn-primary-text: #333;
            --btn-primary-shadow: rgba(255, 215, 0, 0.4);
            --btn-secondary-bg: rgba(255, 255, 255, 0.1);
            --btn-secondary-text: white;
            --btn-secondary-border: rgba(255, 255, 255, 0.3);
            --btn-disabled-bg: #666;
            --btn-disabled-text: #999;
            
            /* Team Selection */
            --team-selected-border: #ffd700;
            --team-selected-bg: rgba(255, 215, 0, 0.2);
            --team-selected-shadow: rgba(255, 215, 0, 0.3);
            
            /* Error Colors */
            --error-text: #ff6b6b;
            --error-bg: rgba(255, 107, 107, 0.1);
            
            /* Border Colors */
            --border-subtle: rgba(255, 255, 255, 0.2);
            
            /* Shadow */
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-button: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        /* Catppuccin Mocha Theme for Dan/Daniel */
        .theme-purple {
            /* Background Colors - Using Catppuccin Mocha Base/Mantle/Surface */
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #313244 100%);
            --bg-secondary: rgba(30, 30, 46, 0.95);
            --bg-tertiary: rgba(69, 71, 90, 0.8);
            --bg-tertiary-hover: rgba(88, 91, 112, 0.9);
            
            /* Text Colors - Using Catppuccin Text/Subtext */
            --text-primary: #cdd6f4;
            --text-secondary: #f5c2e7;
            --text-muted: #bac2de;
            
            /* Input Colors */
            --input-bg: rgba(205, 214, 244, 0.9);
            --input-text: #1e1e2e;
            --input-focus-shadow: rgba(245, 194, 231, 0.5);
            
            /* Button Colors - Using Catppuccin colors */
            --btn-primary-bg: linear-gradient(45deg, #f9e2af, #fab387);
            --btn-primary-text: #1e1e2e;
            --btn-primary-shadow: rgba(249, 226, 175, 0.4);
            --btn-secondary-bg: rgba(69, 71, 90, 0.8);
            --btn-secondary-text: #cdd6f4;
            --btn-secondary-border: rgba(108, 112, 134, 0.5);
            --btn-disabled-bg: #45475a;
            --btn-disabled-text: #6c7086;
            
            /* Team Selection */
            --team-selected-border: #f5c2e7;
            --team-selected-bg: rgba(245, 194, 231, 0.2);
            --team-selected-shadow: rgba(245, 194, 231, 0.3);
            
            /* Error Colors */
            --error-text: #f38ba8;
            --error-bg: rgba(243, 139, 168, 0.1);
            
            /* Border Colors */
            --border-subtle: rgba(108, 112, 134, 0.3);
            
            /* Shadow - Darker for Catppuccin aesthetic */
            --shadow-primary: 0 10px 30px rgba(17, 17, 27, 0.4);
            --shadow-button: 0 5px 15px rgba(249, 226, 175, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-primary);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 3em;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.4em;
            margin-bottom: 40px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 30px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            background: var(--input-bg);
            color: var(--input-text);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 10px var(--input-focus-shadow);
        }

        .team-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .team-btn {
            padding: 25px;
            border: 3px solid transparent;
            border-radius: 15px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .team-btn:hover {
            background: var(--bg-tertiary-hover);
            transform: translateY(-2px);
        }

        .team-btn.selected {
            border-color: var(--team-selected-border);
            background: var(--team-selected-bg);
            box-shadow: 0 0 15px var(--team-selected-shadow);
        }

        .team-btn.team1 { background: linear-gradient(45deg, #ff6b6b, #ff8e8e); }
        .team-btn.team2 { background: linear-gradient(45deg, #4ecdc4, #6ee2dd); }
        .team-btn.team3 { background: linear-gradient(45deg, #ffe66d, #fff89e); color: #333; }
        .team-btn.team4 { background: linear-gradient(45deg, #a8e6cf, #c8f7c5); color: #333; }

        .join-btn {
            width: 100%;
            padding: 22px;
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-button);
        }

        .join-btn:disabled {
            background: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .host-link {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid var(--border-subtle);
        }

        .host-btn {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 2px solid var(--btn-secondary-border);
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .host-btn:hover {
            background: var(--bg-tertiary-hover);
            border-color: var(--text-secondary);
        }

        .error {
            color: var(--error-text);
            background: var(--error-bg);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .logo {
                font-size: 2em;
            }
            
            .team-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎯 JEOPARDY</div>
        <div class="subtitle">Buzzer System</div>
        
        <form id="joinForm">
            <div class="form-group">
                <label for="playerName">Your Name:</label>
                <input type="text" id="playerName" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label>Select Your Team:</label>
                <div class="team-selector">
                    <div class="team-btn team1" data-team="1">
                        <div>Team 1</div>
                        <div id="team1Count">0 players</div>
                    </div>
                    <div class="team-btn team2" data-team="2">
                        <div>Team 2</div>
                        <div id="team2Count">0 players</div>
                    </div>
                    <div class="team-btn team3" data-team="3">
                        <div>Team 3</div>
                        <div id="team3Count">0 players</div>
                    </div>
                    <div class="team-btn team4" data-team="4">
                        <div>Team 4</div>
                        <div id="team4Count">0 players</div>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="join-btn" id="joinBtn" disabled>Join Game</button>
            <div class="error" id="errorMsg"></div>
        </form>
        
        <div class="host-link">
            <a href="host.html" class="host-btn">🎮 Host Controls</a>
        </div>

        <div id="versionTag" style="margin-top: 15px; font-size: 0.75em; color: var(--text-muted); opacity: 0.6;"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="shared.js"></script>
    <script>
        let selectedTeam = null;

        // Team selection
        document.querySelectorAll('.team-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove previous selection
                document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('selected'));
                
                // Select new team
                btn.classList.add('selected');
                selectedTeam = btn.dataset.team;
                
                // Enable join button if name is entered
                updateJoinButton();
            });
        });

        // Name input
        document.getElementById('playerName').addEventListener('input', (e) => {
            updateJoinButton();
            applyThemeForName(e.target.value);
        });

        function updateJoinButton() {
            const name = document.getElementById('playerName').value.trim();
            const joinBtn = document.getElementById('joinBtn');
            
            if (name && selectedTeam && isConnected()) {
                joinBtn.disabled = false;
            } else {
                joinBtn.disabled = true;
            }
        }

        // Apply theme based on player name
        function applyThemeForName(playerName) {
            // Remove any existing theme classes
            document.body.classList.remove('theme-blue', 'theme-purple');
            
            // Check if player name contains "dan" anywhere (case insensitive)
            const name = playerName.toLowerCase().trim();
            if (name.includes('dan')) {
                document.body.classList.add('theme-purple');
            } else {
                // Default to blue theme for other players
                document.body.classList.add('theme-blue');
            }
        }

        // Form submission
        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('playerName').value.trim();
            const joinBtn = document.getElementById('joinBtn');
            
            if (!name || !selectedTeam) {
                showError('Please enter your name and select a team');
                return;
            }

            if (!isConnected()) {
                showError('Not connected to server. Please refresh the page.');
                return;
            }

            // Disable button during registration
            joinBtn.disabled = true;
            joinBtn.textContent = 'Joining game...';

            try {
                // Register player with server
                const player = await registerPlayer({
                    name: name,
                    team: parseInt(selectedTeam)
                });

                // Store player info in session
                sessionStorage.setItem('currentPlayer', JSON.stringify(player));

                // Redirect to player page
                window.location.href = 'player.html';
            } catch (error) {
                showError(error.message || 'Failed to join game');
                joinBtn.disabled = false;
                joinBtn.textContent = 'Join Game';
            }
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 3000);
        }

        function generateId() {
            return 'player_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Update team counts
        function updateTeamCounts() {
            const gameState = getGameState();
            
            for (let i = 1; i <= 4; i++) {
                const count = gameState.players.filter(p => p.team === i).length;
                const plural = count === 1 ? 'player' : 'players';
                document.getElementById(`team${i}Count`).textContent = `${count} ${plural}`;
            }
        }

        // Initialize and listen for updates
        updateTeamCounts();
        
        // Initialize with default theme
        applyThemeForName('');
        
        // Listen for game state changes
        window.addEventListener('gameStateChanged', updateTeamCounts);
        window.addEventListener('socketConnected', updateJoinButton);
        window.addEventListener('socketDisconnected', updateJoinButton);

        // Shows which commit is actually deployed, so it's obvious from the browser
        // whether a redeploy has picked up the latest changes.
        fetch('/api/version', { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                document.getElementById('versionTag').textContent = `v${data.version}`;
            })
            .catch(() => {});
    </script>
</body>
</html>
